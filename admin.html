<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Catálogo de Ropa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-pink-600">Panel de Administración</h1>
            <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">Ver Catálogo</a>
        </div>

        <!-- Formulario para agregar producto -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Agregar Nueva Prenda</h2>
            <form action="guardar.php" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Nombre de la prenda</label>
                    <input type="text" name="nombre" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-pink-500 focus:border-pink-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Precio ($)</label>
                    <input type="number" step="0.01" name="precio" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-600">Descripción</label>
                    <textarea name="descripcion" rows="2" class="w-full mt-1 p-2 border border-gray-300 rounded-lg"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Tallas (ej: S, M, L)</label>
                    <input type="text" name="tallas" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Colores</label>
                    <input type="text" name="colores" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Stock (Cantidad)</label>
                    <input type="number" name="stock" value="1" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">URL de la Imagen</label>
                    <input type="text" name="url_imagen" placeholder="https://ejemplo.com/foto.jpg" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Categoría</label>
                    <select name="categoria_id" class="w-full mt-1 p-2 border border-gray-300 rounded-lg">
                        <option value="1">Blusas y Tops</option>
                        <option value="2">Pantalones</option>
                    </select>
                </div>
                <div class="md:col-span-2 mt-4">
                    <button type="submit" class="w-full bg-pink-600 text-white p-3 rounded-lg font-semibold hover:bg-pink-700 transition">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
